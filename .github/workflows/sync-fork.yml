name: Sync OSC Fork

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "prod"
        type: choice
        options:
          - prod
          - dev
          - stage
  workflow_call:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: string

jobs:
  sync-fork:
    name: Sync fork (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: sync-fork-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Validate environment
        run: |
          case "${{ inputs.environment }}" in
            prod|dev|stage) ;;
            *) echo "Invalid environment: ${{ inputs.environment }}"; exit 1 ;;
          esac

      - name: Install OSC CLI
        run: npm install -g @osaas/cli@4.33.2

      - name: Trigger sync fork
        env:
          OSC_ACCESS_TOKEN: unused
          OSC_API_KEY: ${{ secrets.OSC_API_KEY }}
        run: osc --env "${{ inputs.environment }}" admin sync-fork --wait eyevinn-open-live

      - name: Restart olivedev service instances
        if: inputs.environment == 'prod'
        env:
          # `osc restart` authenticates with OSC_ACCESS_TOKEN; it never reads OSC_API_KEY.
          OSC_ACCESS_TOKEN: ${{ secrets.OSC_OLIVEDEV_PAT }}
        run: |
          set -uo pipefail
          if [ -z "$OSC_ACCESS_TOKEN" ]; then
            echo "::error::OSC_OLIVEDEV_PAT secret is empty"
            exit 1
          fi
          # @osaas/cli 4.33.2 `restart` exits 0 even when the restart fails. With --json it
          # prints {"restarted":true} to stdout only on success ({"error":...} to stderr
          # otherwise), so check the output. Restart both instances before failing the job.
          failed=0
          for service in eyevinn-open-live eyevinn-open-live-studio; do
            if out=$(osc --env prod --json restart "$service" openlivedev < /dev/null) \
              && grep -Fq '"restarted":true' <<<"$out"; then
              echo "Restarted $service/openlivedev"
            else
              echo "::error::Failed to restart $service/openlivedev"
              failed=1
            fi
          done
          exit "$failed"
