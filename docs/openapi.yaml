  # Production — Clip cue/play control (epic #206, issue #277)

  /api/v1/productions/{id}/clips/{mixerInput}/cue:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: mixerInput
        in: path
        required: true
        schema:
          type: string
          pattern: '^video_in_\d{1,2}$'
        description: Mixer input the clip source is assigned to, e.g. `video_in_0`
    post:
      summary: Cue a clip into the ready state
      description: >-
        Preflight-checks the clip's resolved URL for reachability, loads it into the
        media-player block, seeks to index 0 (Strom
        `player.setPlaylist({files:[clip]}) + player.goto({index:0})`), then waits for
        Strom to confirm a loaded duration before reporting `cued`.

        `clipId` selects WHICH clip to load (OL-19): it is a clip SOURCE id (see
        `GET /api/v1/sources?streamType=clip`). The slot is a player; the clip is chosen
        at Cue time. The source must exist and be `streamType: clip` (else 404). Without
        `clipId` the source assigned to `mixerInput` is loaded (unchanged). The returned
        `ClipState.clipId` and the persisted cue (used to restore on reactivate/reconnect)
        follow the loaded source; the production's source assignment stays the slot's
        default. On-air guard: a Cue carrying `clipId` is refused with 409 while the slot's
        player is `playing` — Stop first. A non-2xx/unreachable
        URL or a duration that never arrives fails the cue with a 502 rather than
        reporting `cued` for media that cannot play (issue #351).
      operationId: cueClip
      tags: [Productions]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                clipId:
                  type: string
                  minLength: 1
                  maxLength: 256
                  description: >-
                    Id of the clip source (`streamType: clip`) to load into this slot.
                    Omit to load the source assigned to the mixer input.
      responses:
        '200':
          description: Clip cued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClipState'
        '400':
          description: Invalid body or mixerInput
        '401':
          description: Missing/invalid API key (when configured)
        '404':
          description: Production not found, or `clipId` names no source / a non-clip source
        '409':
          description: Production is not activated, or `clipId` given while the slot is playing
        '502':
          description: >-
            Strom returned an error, or the clip's media could not be reached/loaded
            (issue #351). Like other 5xx responses the body carries a generic message
            (`src/server.ts`'s error handler never leaks internals on 5xx); the specific
            reason (e.g. `Clip URL returned HTTP 403`) is surfaced over the WebSocket
            controller's `CLIP_STATE`/`ERROR` frames for this same cue.
        '503':
          description: Strom is unreachable

  /api/v1/productions/{id}/clips/{mixerInput}/play:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: mixerInput
        in: path
        required: true
        schema:
          type: string
          pattern: '^video_in_\d{1,2}$'
    post:
      summary: Play the currently cued clip
