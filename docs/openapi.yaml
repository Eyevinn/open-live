openapi: 3.1.0
info:
  title: Open Live API
  version: 1.0.0
  description: |
    REST API for the Open Live broadcast production platform.

    **Authentication**: Pass an API key via `Authorization: Bearer <key>` header or `?key=<key>` query parameter.
    The following paths are exempt from authentication: `/health`, `/ready`, `/api/v1/status`, `/api/v1/server-info`.

servers:
  - url: /

security:
  - bearerAuth: []
  - apiKeyQuery: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    apiKeyQuery:
      type: apiKey
      in: query
      name: key

  schemas:
    # ── Primitives ──────────────────────────────────────────────────────────────

    StreamType:
      type: string
      enum: [srt, efp, whip, html, clip]
      description: >-
        Source stream kind. `clip` (epic #206) is a cue-then-play file/story
        source whose typed `ClipReference` is stored serialized in the source's
        `address` field. Clients must ignore unknown enum values (forward-compat).

    ClipReference:
      description: >-
        Typed, versioned reference for a `clip` source (epic #206, issue #275).
        A discriminated union on `type`; stored serialized as a JSON string in
        `SourceDoc.address`. v1 implements `url` and `s3`; `tams` is reserved and
        rejected at runtime (501). Any variant may carry an optional `timerange`
        — nothing assumes a fixed media length.
      oneOf:
        - $ref: '#/components/schemas/ClipReferenceUrl'
        - $ref: '#/components/schemas/ClipReferenceS3'
        - $ref: '#/components/schemas/ClipReferenceTams'
      discriminator:
        propertyName: type

    ClipReferenceUrl:
      type: object
      required: [type, url]
      properties:
        type:
          type: string
          enum: [url]
        url:
          type: string
          description: Any fetchable file / object-storage URL (a presigned URL reduces to this).
        timerange:
          type: string
          description: Optional; no fixed-length assumption.

    ClipReferenceS3:
      type: object
      required: [type, bucket, key]
      properties:
        type:
          type: string
          enum: [s3]
        bucket:
          type: string
        key:
          type: string
        timerange:
          type: string

    ClipReferenceTams:
      type: object
      description: BBC Time-Addressable Media Store. Reserved — rejected (501) in v1.
      required: [type, store, flowId, timerange]
      properties:
        type:
          type: string
          enum: [tams]
        store:
          type: string
        flowId:
          type: string
        timerange:
          type: string

    ClipState:
      type: object
      description: >-
        Live clip playback state for a `clip` source assigned to a mixer input
        (epic #206, issues #277/#278). CamelCased mirror of Strom's media-player
        state plus the cue/play/completed clip state machine.
      required: [mixerInput, state]
      properties:
        mixerInput:
          type: string
          example: video_in_0
        state:
          type: string
          enum: [idle, cued, playing, paused, stopped, completed, error]
        clipId:
          type: string
        positionMs:
          type: integer
        durationMs:
          type: integer
        error:
          type: string

    SourceStatus:
      type: string
      enum: [active, inactive]

    OutputType:
      type: string
      enum: [mpegtssrt, efpsrt, whep, recording]
      description: >
        Output kind. 'recording' archives the programme to MinIO/S3 as a VOD via
        Strom's builtin recorder (uploaded from local segments post-deactivate);
        it is only accepted when MinIO/S3 is configured, otherwise creating a
        recording output returns 400.

    OutputStatus:
      type: string
      description: >-
        Derived output health (issue #255). `healthy` = the owning production is
        active with a running flow; `down` = not running; `unknown` = health
        could not be determined (or field absent, which is equivalent to
        `unknown`). `degraded` is reserved in the enum for a future per-output
        signal and is never emitted today. Clients must ignore unknown enum
        values (forward-compat).
      enum: [healthy, degraded, down, unknown]

    ProductionStatus:
      type: string
      description: >-
        Production lifecycle status. `ended` (issue #255) means the production
        ran a broadcast that has finished, distinct from `inactive` (never
        started / clean idle). Clients must ignore unknown enum values
        (forward-compat).
      enum: [active, inactive, activating, ended]

    MacroActionType:
      type: string
      enum: [CUT, TRANSITION, TAKE, GRAPHIC_ON, GRAPHIC_OFF, DSK_TOGGLE]

    ConfigValues:
      type: object
      additionalProperties:
        oneOf:
          - type: string
          - type: number
          - type: boolean

    # ── Source ──────────────────────────────────────────────────────────────────

    Source:
      type: object
      required: [id, name, address, streamType, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
        streamType:
          $ref: '#/components/schemas/StreamType'
        status:
          $ref: '#/components/schemas/SourceStatus'
        liveCamera:
          type: boolean
        latency:
          type: integer
          minimum: 20
          maximum: 8000
          description: SRT latency in milliseconds
        audioStreamIndex:
          type: integer
          minimum: 0
          description: >-
            0-based index of the audio elementary stream this srt/efp source uses
            (issue #515). Absent means 0 (the first stream). Only valid for `srt`
            and `efp` sources (400 otherwise). Applied at the next activation; a
            value that cannot be applied is clamped to the first stream and
            reported as an `audio-stream-not-applied` activation warning (#516).
        liveIngest:
          type: object
          description: >-
            Read-only, server-observed WHIP live-ingest state (issue #439,
            interim — parent #437). Separate from the client-writable `status`
            field and NEVER overwrites it; clients cannot set `liveIngest`.
            Present only once a WHIP offer/teardown has been observed for this
            source and only for `whip` sources; absent otherwise. In-memory
            only — resets on server restart. KNOWN INTERIM LIMITATION: a
            publisher that drops without sending a WHIP DELETE stays
            `connected`; a robust version keying off Strom session events is a
            separate out-of-scope issue.
          required: [state, changedAt]
          properties:
            state:
              type: string
              enum: [connected, disconnected]
            changedAt:
              type: string
              format: date-time
              description: ISO-8601 UTC time of the last ingest-state transition.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SourceInput:
      type: object
      required: [name, address, streamType]
      properties:
        name:
          type: string
          minLength: 1
        address:
          type: string
        streamType:
          $ref: '#/components/schemas/StreamType'
        status:
          $ref: '#/components/schemas/SourceStatus'
          default: inactive
        liveCamera:
          type: boolean
        latency:
          type: integer
          minimum: 20
          maximum: 8000
        audioStreamIndex:
          type: integer
          minimum: 0
          description: >-
            0-based index of the audio elementary stream this srt/efp source uses
            (issue #515). Absent means 0 (the first stream). Only valid for `srt`
            and `efp` sources (400 otherwise). Applied at the next activation; a
            value that cannot be applied is clamped to the first stream and
            reported as an `audio-stream-not-applied` activation warning (#516).

    SourcePatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        address:
          type: string
        streamType:
          $ref: '#/components/schemas/StreamType'
        status:
          $ref: '#/components/schemas/SourceStatus'
        liveCamera:
          type: boolean
        latency:
          type: integer
          minimum: 20
          maximum: 8000
        audioStreamIndex:
          type: integer
          minimum: 0
          description: >-
            0-based index of the audio elementary stream this srt/efp source uses
            (issue #515). Absent means 0 (the first stream). Only valid for `srt`
            and `efp` sources (400 otherwise). Applied at the next activation; a
            value that cannot be applied is clamped to the first stream and
            reported as an `audio-stream-not-applied` activation warning (#516).

    # ── Graphic ─────────────────────────────────────────────────────────────────

    Graphic:
      type: object
      required: [id, name, url, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GraphicInput:
      type: object
      required: [name, url]
      properties:
        name:
          type: string
          minLength: 1
        url:
          type: string

    GraphicPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        url:
          type: string

    # ── Output ──────────────────────────────────────────────────────────────────

    Output:
      type: object
      required: [id, name, outputType, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        outputType:
          $ref: '#/components/schemas/OutputType'
        url:
          type: string
          description: >-
            Operator-authored SRT bind/listen URI (e.g. srt://:43524?mode=listener).
            Undefined for whep outputs. Round-tripped by POST/PATCH.
        connect:
          $ref: '#/components/schemas/SrtConnect'
        status:
          allOf:
            - $ref: '#/components/schemas/OutputStatus'
          description: >-
            Derived output health (issue #255). Read-only; computed on read from
            the owning production's live flow state, not persisted. Optional —
            an absent value is equivalent to `unknown`.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RecordingAsset:
      type: object
      description: >-
        A recorded VOD asset archived to MinIO/S3 (epic #5, issue #42). One asset
        is persisted per uploaded object when a production with a `recording`
        output deactivates. `playbackUrl` is a time-boxed presigned GET URL
        (TTL = RECORDING_PRESIGN_TTL_S) so a private bucket's recordings can be
        played without exposing storage credentials; it is omitted when a
        presigned URL cannot be produced (e.g. bucket reconfigured).
      required: [id, productionId, bucket, key, startedAt, createdAt, updatedAt]
      properties:
        id:
          type: string
        productionId:
          type: string
        outputId:
          type: string
          description: The 'recording' output that produced this asset, when known.
        bucket:
          type: string
        key:
          type: string
          description: Object key within the bucket.
        sizeBytes:
          type: integer
        durationMs:
          type: integer
        activationId:
          type: string
          description: >-
            The activation (Strom flow id) that recorded this part. Absent on
            older recordings and on files an earlier activation left on Strom.
        partIndex:
          type: integer
          description: >-
            Part number from the file name's `_%05d` suffix, from 0. With
            RECORDING_SEGMENT_SECS > 0, parts are uploaded and listed while the
            production is still live.
        kind:
          type: string
          enum: [program, input]
          description: >-
            Program recording or one input's own recording (OL-32). Always
            `program` today; recordings stored before the field existed are
            backfilled to and read as `program`. Clients must accept other
            values added later.
        recorderType:
          type: string
          enum: [liverecorder, recorder]
          description: >-
            The Strom block that wrote the file: `liverecorder`
            (`builtin.liverecorder`, fragmented MP4) or `recorder`
            (`builtin.recorder`). Set on parts of the activation that recorded
            them; absent on older recordings and on leftovers of earlier
            activations.
        startedAtSource:
          type: string
          enum: [strom, event, chained, filename]
          description: >-
            How `startedAt` was derived, best first: `strom` (the file's own
            start reported by Strom), `event` (when open-live received the
            recorder's file-opened event), `chained` (the previous part's start
            + duration), `filename` (the session stamp in the file name +
            earlier parts' durations). Absent on older recordings (= `filename`).
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        playbackUrl:
          type: string
          description: Presigned GET URL for playback. Omitted when unavailable.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SrtConnect:
      type: object
      description: >-
        Read-only, server-derived dial-in address an external SRT caller uses to
        reach this output. Present only on mpegtssrt/efpsrt outputs that have a
        well-formed bind URL. `uri`/`host` are null (with a `reason`) when the
        Strom SRT host cannot be resolved server-side; `port` is always present.
      required: [uri, host, port, mode, source]
      properties:
        uri:
          type: string
          nullable: true
          description: Assembled srt://host:port?mode=… dial-in string, or null when host is unresolved.
        host:
          type: string
          nullable: true
          description: Resolved SRT host external callers dial, or null when unresolved.
        port:
          type: integer
          description: SRT port parsed from the authored bind URI.
        mode:
          type: string
          enum: [caller, listener]
          description: The SRT mode the EXTERNAL side should use (inverse of the authored mode).
        source:
          type: string
          enum: [authored-host, srt-public-host, strom-host, unknown]
          description: Provenance of the resolved host.
        reason:
          type: string
          enum: [srt-host-not-configured, srt-host-not-loopback-reachable, strom-url-not-parseable]
          description: Present only when `uri` is null — why the host could not be resolved.

    OutputInput:
      type: object
      required: [name, outputType]
      properties:
        name:
          type: string
          minLength: 1
        outputType:
          $ref: '#/components/schemas/OutputType'
        url:
          type: string

    OutputPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        url:
          type: string

    # ── Production Config ────────────────────────────────────────────────────────

    ProductionConfig:
      type: object
      required: [id, name, values, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        values:
          $ref: '#/components/schemas/ConfigValues'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProductionConfigInput:
      type: object
      required: [name, values]
      properties:
        name:
          type: string
          minLength: 1
        values:
          $ref: '#/components/schemas/ConfigValues'

    ProductionConfigPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        values:
          $ref: '#/components/schemas/ConfigValues'

    # ── Macro ────────────────────────────────────────────────────────────────────

    MacroAction:
      type: object
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/MacroActionType'
        sourceId:
          type: string
        transitionType:
          type: string
        durationMs:
          type: integer
          minimum: 1
        overlayId:
          type: string
        layer:
          type: integer
          minimum: 0
        visible:
          type: boolean

    Macro:
      type: object
      required: [id, slot, label, color, actions]
      properties:
        id:
          type: string
        slot:
          type: integer
          minimum: 0
          maximum: 7
        label:
          type: string
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/MacroAction'

    MacroInput:
      type: object
      required: [slot, label, color]
      properties:
        slot:
          type: integer
          minimum: 0
          maximum: 7
        label:
          type: string
          minLength: 1
          maxLength: 50
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/MacroAction'
          default: []

    MacroPatch:
      type: object
      properties:
        slot:
          type: integer
          minimum: 0
          maximum: 7
        label:
          type: string
          minLength: 1
          maxLength: 50
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/MacroAction'

    # ── Production ───────────────────────────────────────────────────────────────

    ProductionSourceAssignment:
      type: object
      required: [sourceId, mixerInput]
      properties:
        sourceId:
          type: string
        mixerInput:
          type: string
          pattern: '^video_in_\d{1,2}$'
        returnFeed:
          type: object
          description: >-
            Present when this assignment is a guest slot (issue #381): a per-guest
            mix-minus return built into the flow as a return bus at activation.
            Absent for an ordinary source assignment. v1 supports the synced
            (picture-switch) return only (`lowLatency: false`).
          required: [synced]
          properties:
            synced:
              type: string
              enum: [program, program-minus]
              default: program-minus
            lowLatency:
              type: boolean
              enum: [false]
              default: false

    ProductionGraphicAssignment:
      type: object
      required: [graphicId, dskInput]
      properties:
        graphicId:
          type: string
        dskInput:
          type: string

    ProductionOutputAssignment:
      type: object
      required: [outputId]
      properties:
        outputId:
          type: string

    Pipeline:
      type: object
      required: [status]
      properties:
        stromConfig:
          type: object
          nullable: true
          additionalProperties: true
        status:
          type: string
          enum: [stopped, running]

    Tally:
      type: object
      properties:
        pgm:
          type: string
          nullable: true
        pvw:
          type: string
          nullable: true

    # Audio processing (issue #527, OL-25). Ranges mirror Strom exactly; a
    # running Strom's GET /api/blocks is authoritative. All numeric params are
    # partial so a single knob can move per request.
    AudioProcessingStageParams:
      type: object
      description: >
        Params for one processing stage. Which keys apply depends on the stage:
        gain → {gain}; hpf → {enabled, freq}; gate → {enabled, threshold,
        attack, release}; comp → {enabled, threshold, ratio, attack, release,
        makeup, knee}; eq → {enabled, bands[]}; limiter → {enabled, threshold}.
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        gain:
          type: number
          description: Channel input gain, dB (-20 to +20).
          minimum: -20
          maximum: 20
        freq:
          type: number
          description: HPF cutoff, Hz (20 to 500). Live; the hpf enable flag takes effect on next activation.
          minimum: 20
          maximum: 500
        threshold:
          type: number
          description: "Gate/comp threshold dB (-60 to 0); limiter threshold dB (-20 to 0)."
        ratio:
          type: number
          description: Compressor ratio (1:1 to 20:1).
          minimum: 1
          maximum: 20
        attack:
          type: number
          description: Gate/comp attack, ms (0.1 to 200).
          minimum: 0.1
          maximum: 200
        release:
          type: number
          description: Gate/comp release, ms (10 to 1000).
          minimum: 10
          maximum: 1000
        makeup:
          type: number
          description: Compressor makeup gain, dB (0 to 24).
          minimum: 0
          maximum: 24
        knee:
          type: number
          description: Compressor knee, dB (-24 to 0).
          minimum: -24
          maximum: 0
        bands:
          type: array
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [band]
            properties:
              band:
                type: integer
                minimum: 1
                maximum: 4
              freq:
                type: number
                description: EQ band frequency, Hz (20 to 20000).
                minimum: 20
                maximum: 20000
              gain:
                type: number
                description: EQ band gain, dB (-15 to +15).
                minimum: -15
                maximum: 15
              q:
                type: number
                description: EQ band Q (0.1 to 10).
                minimum: 0.1
                maximum: 10

    AudioProcessing:
      type: object
      description: Current processing state keyed by stage (gain/hpf/gate/comp/eq on a channel; comp/eq/limiter on main).
      additionalProperties:
        $ref: '#/components/schemas/AudioProcessingStageParams'

    ActivationWarning:
      description: >-
        A problem found while going on air that did not stop activation. Each
        `message` is also sent as a WS `ERROR` frame on controller connect while
        the production is live. Clients should ignore unknown `type` values.
      oneOf:
        - $ref: '#/components/schemas/RecordingNoAudioWarning'
        - $ref: '#/components/schemas/AudioStreamNotAppliedWarning'
      discriminator:
        propertyName: type
        mapping:
          recording-no-audio: '#/components/schemas/RecordingNoAudioWarning'
          audio-stream-not-applied: '#/components/schemas/AudioStreamNotAppliedWarning'

    RecordingNoAudioWarning:
      type: object
      required: [type, message]
      properties:
        type:
          type: string
          enum: [recording-no-audio]
        message:
          type: string

    AudioStreamNotAppliedWarning:
      type: object
      description: >-
        A source's `audioStreamIndex` was not applied on one input; the input
        was built on the first audio stream instead (issue #516). One warning
        per affected `mixerInput`.
      required: [type, sourceId, mixerInput, requestedIndex, appliedIndex, reason, message]
      properties:
        type:
          type: string
          enum: [audio-stream-not-applied]
        sourceId:
          type: string
        mixerInput:
          type: string
          description: Stored assignment key (e.g. `video_in_3`), matching the input in Studio.
        requestedIndex:
          type: integer
          minimum: 1
          description: The source's effective `audioStreamIndex` (0-based).
        appliedIndex:
          type: integer
          enum: [0]
          description: Always 0 (the first stream) in v1.
        reason:
          type: string
          enum: [stream-type-unsupported, strom-capability-missing, stream-not-present]
          description: >-
            `stream-type-unsupported`: `efp` source (selection is MPEG-TS/SRT only).
            `strom-capability-missing`: this Strom cannot map audio outputs by PID
            order yet. `stream-not-present`: the index is above the supported
            ceiling (more than 8 audio streams) or the feed lacks that stream.
        message:
          type: string
          description: Human text with 1-based stream numbers.

    AudioStreamDiscovery:
      type: object
      required: [selectedIndex, discovery, streams]
      properties:
        selectedIndex:
          type: integer
          minimum: 0
          description: The persisted `audioStreamIndex`, or 0 when absent.
        discovery:
          type: string
          enum: [available, unavailable]
        reason:
          type: string
          enum: [no-live-flow, strom-probe-unsupported]
          description: Present when `discovery` is `unavailable`.
        streams:
          type: array
          nullable: true
          description: Derived at read time, never persisted. `null` when discovery is unavailable.
          items:
            type: object
            properties:
              index:
                type: integer
              codec:
                type: string
              channels:
                type: integer
              language:
                type: string

    Production:
      type: object
      required: [id, name, status, sources, pipeline, macros, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          $ref: '#/components/schemas/ProductionStatus'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/ProductionSourceAssignment'
        outputAssignments:
          type: array
          items:
            $ref: '#/components/schemas/ProductionOutputAssignment'
        graphicAssignments:
          type: array
          items:
            $ref: '#/components/schemas/ProductionGraphicAssignment'
        stromFlowId:
          type: string
        whepEndpoint:
          type: string
          description: Multiview WHEP endpoint URL
        pgmWhepEndpoint:
          type: string
          description: Programme output WHEP endpoint URL
        whipEndpoints:
          type: array
          items:
            type: object
            properties:
              mixerInput:
                type: string
              url:
                type: string
        srtOutputUri:
          type: string
        values:
          $ref: '#/components/schemas/ConfigValues'
        airTime:
          type: string
          format: date-time
          nullable: true
        pipeline:
          $ref: '#/components/schemas/Pipeline'
        macros:
          type: array
          items:
            $ref: '#/components/schemas/Macro'
        tally:
          $ref: '#/components/schemas/Tally'
        recorderType:
          type: string
          enum: [liverecorder, recorder]
          description: >-
            Which Strom block records program in the running activation (OL-32a):
            `liverecorder` when the Strom has `builtin.liverecorder` and
            RECORDING_BLOCK is `auto`, else `recorder`. Set on activate when a
            `recording` output is assigned, cleared on deactivate.
        activationWarnings:
          type: array
          description: >-
            Problems found while going on air that did not stop activation.
            Cleared when a new activation starts or activation fails.
          items:
            $ref: '#/components/schemas/ActivationWarning'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProductionInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1

    ProductionPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        values:
          $ref: '#/components/schemas/ConfigValues'
        airTime:
          type: string
          format: date-time
          nullable: true

    # ── Misc ─────────────────────────────────────────────────────────────────────

    IceServer:
      type: object
      required: [urls]
      properties:
        urls:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        username:
          type: string
        credential:
          type: string

    Error:
      type: object
      properties:
        error:
          type: string
        statusCode:
          type: integer

    RecordingDeleteError:
      type: object
      description: Error body of DELETE /api/v1/recordings/{id} for 409 and 502 (issue #550).
      required: [error, reason, statusCode]
      properties:
        error:
          type: string
        reason:
          type: string
          enum:
            - connection-missing
            - connection-no-bucket
            - storage-not-configured
            - bucket-mismatch
            - storage-denied
            - storage-failed
        statusCode:
          type: integer

    # ── Guest calling (epic #208, issue #299) ─────────────────────────────────────

    GuestInviteCreate:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 256
        expiresInS:
          type: integer
          minimum: 60
          maximum: 604800
          description: Override the default invite TTL (GUEST_INVITE_TTL_S). Bounded so invites stay short-lived.
        mixerInput:
          type: string
          pattern: '^video_in_\d{1,2}$'
          maxLength: 64
          description: >-
            The guest slot this invite pins the guest to (issue #381). Required in
            practice: it must name a declared guest slot on this production (a
            source assignment carrying a `returnFeed`); an invite with no slot, or
            one whose input is not a guest slot, is rejected with 400.

    GuestInviteCreated:
      type: object
      required: [id, productionId, joinUrl, token, expiresAt]
      properties:
        id:
          type: string
        productionId:
          type: string
        joinUrl:
          type: string
        token:
          type: string
          description: The raw HMAC-signed invite token. Returned exactly once and NEVER stored — only its SHA-256 hash is persisted.
        expiresAt:
          type: string
          format: date-time
        mixerInput:
          type: string

    GuestInvite:
      type: object
      required: [id, productionId, expiresAt, createdAt, updatedAt]
      properties:
        id:
          type: string
        productionId:
          type: string
        label:
          type: string
        mixerInput:
          type: string
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GuestSession:
      type: object
      required: [id, productionId, inviteId, mixerInput, state, createdAt, updatedAt]
      properties:
        id:
          type: string
        productionId:
          type: string
        inviteId:
          type: string
        mixerInput:
          type: string
        state:
          type: string
          enum: [joined, previewing, on-air, left, error]
        intercomLineId:
          type: string
        whipSessionId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GuestReturnMode:
      type: object
      required: [key, label, synced, delivery]
      properties:
        key:
          type: string
          enum: [program, program-minus, low-latency-minus]
        label:
          type: string
        synced:
          type: boolean
        excludesMixerInput:
          type: string
        delivery:
          type: object

    ReturnModeBody:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [program, program-minus, low-latency-minus]
          description: >-
            `program` opens the guest's own send; `program-minus` (default) closes it
            for mix-minus. `low-latency-minus` is a client-side feed choice not built in
            v1 and returns 400.

    ReturnModeResult:
      type: object
      required: [mixerInput, mode]
      properties:
        mixerInput:
          type: string
        mode:
          type: string
          enum: [program, program-minus]

    GuestReturnState:
      type: object
      required: [mixerInput, mode, modes, defaultMode]
      properties:
        mixerInput:
          type: string
        mode:
          type: string
          enum: [program, program-minus]
          description: Current mode of the guest's picture-feed audio.
        modes:
          type: array
          items:
            $ref: '#/components/schemas/GuestReturnMode'
        defaultMode:
          type: string

    GuestJoinResult:
      type: object
      required: [guestId, returnOnly, feeds, modes, defaultMode, returnMode]
      properties:
        guestId:
          type: string
        whipUrl:
          type: string
          description: >-
            WHIP publish URL on the EXISTING `/api/v1/productions/{id}/whip/{mixerInput}` contract.
            Absent on a return-only slot.
        returnOnly:
          type: boolean
          description: >-
            True when the slot's source is not WHIP (e.g. an SRT encoder): the guest's picture
            and voice reach the slot another way, so the guest only receives the return.
        feeds:
          type: array
          description: >-
            Per-guest return feeds. In v1 this carries the `picture` feed (program
            video over WHEP with a single mix-minus audio track) when the production
            is active and a return aux bus exists for the guest's input; otherwise empty.
          items:
            type: object
            required: [id, url, video]
            properties:
              id:
                type: string
              url:
                type: string
              video:
                type: boolean
        modes:
          type: array
          items:
            $ref: '#/components/schemas/GuestReturnMode'
        defaultMode:
          type: string
        returnMode:
          type: string
          enum: [program, program-minus]
        intercomLine:
          type: object
          description: Present only when an Open Intercom talkback line is provisioned (later sub-issue).
        iceServers:
          type: array
          description: >-
            The ICE servers for the guest page's PeerConnections: Strom's
            `STROM_SERVER_ICE_SERVERS`, the same list `GET /api/v1/ice-servers`
            gives crew, TURN credentials included. Absent when Strom cannot give
            it within a few seconds; the page then uses a public STUN server.
          items:
            $ref: '#/components/schemas/IceServer'

paths:
  # ── Health ──────────────────────────────────────────────────────────────────

  /health:
    get:
      summary: Liveness probe
      operationId: getHealth
      security: []
      tags: [Health]
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /ready:
    get:
      summary: Readiness probe
      operationId: getReady
      security: []
      tags: [Health]
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
        '503':
          description: Service not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Status ──────────────────────────────────────────────────────────────────

  /api/v1/ping:
    get:
      summary: Ping
      operationId: ping
      security: []
      tags: [Status]
      responses:
        '200':
          description: Pong
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true

  /api/v1/status:
    get:
      summary: Dependency health status
      operationId: getStatus
      security: []
      tags: [Status]
      responses:
        '200':
          description: Current connectivity status
          content:
            application/json:
              schema:
                type: object
                properties:
                  db:
                    type: boolean
                  strom:
                    type: boolean

  /api/v1/server-info:
    get:
      summary: Server information
      operationId: getServerInfo
      security: []
      tags: [Status]
      responses:
        '200':
          description: Server info
          content:
            application/json:
              schema:
                type: object
                required: [stromHost, srtPorts, srtPortState]
                properties:
                  stromHost:
                    type: string
                    description: Hostname of the Strom media server
                  srtPorts:
                    type: array
                    nullable: true
                    description: >-
                      SRT listener ports this instance has reserved from the shared
                      Strom's port pool. Hostless listener sources and outputs
                      (`srt://:PORT?mode=listener`) must use one of them;
                      `srt://:0?mode=listener` asks the server to assign the lowest free
                      one. An explicit list, not a range — Strom's pool can have holes,
                      so these are not necessarily contiguous. Null unless
                      `srtPortState` is `reserved`.
                    items:
                      type: integer
                  srtPortState:
                    type: string
                    enum: [reserved, pending, unsupported, disabled]
                    description: >-
                      State of this instance's port reservation. `pending` — not held yet,
                      listener sources are rejected with 503 until they are; `unsupported` —
                      Strom has no port pool API, or reserving kept failing; ports are not
                      enforced and Strom is re-checked every 10 min; `disabled` — turned off
                      via STROM_PORT_LEASE_DISABLED, or Strom has no port pool configured;
                      ports are not enforced.

  /api/v1/reconnect:
    post:
      summary: Reconnect to database and Strom
      operationId: reconnect
      tags: [Status]
      responses:
        '200':
          description: Reconnect result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  db:
                    type: boolean
                  strom:
                    type: boolean

  # ── Sources ─────────────────────────────────────────────────────────────────

  /api/v1/sources:
    get:
      summary: List sources
      operationId: listSources
      tags: [Sources]
      parameters:
        - name: streamType
          in: query
          required: false
          schema:
            type: string
            enum: [srt, efp, whip, html, clip]
          description: >-
            Only return sources of this stream type. `streamType=clip` lists the
            available clips a controller can Cue into a clip slot (OL-19).
      responses:
        '200':
          description: Array of sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Source'
    post:
      summary: Create source
      operationId: createSource
      tags: [Sources]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceInput'
      responses:
        '201':
          description: Created source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Hostless SRT listener port is outside this instance's leased range (see /api/v1/server-info)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Hostless SRT listener port is already held by another source or output, or no
            port is free in the range for a port-0 assignment request; or the source is a
            `clip` source currently `playing` in a slot of an active production and the patch
            changes its `address` (stop the clip first)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: SRT port range not yet allocated from Strom — retry shortly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/sources/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get source
      operationId: getSource
      tags: [Sources]
      responses:
        '200':
          description: Source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '404':
          description: Not found
    patch:
      summary: Update source
      description: >-
        A `clip` source's `address` may be changed while the source is assigned or cued in
        an active production; the change takes effect at the NEXT Cue of that source (the
        player keeps what it already loaded). The patch is rejected with 409 only while the
        clip is currently `playing` in some slot (OL-19).
      operationId: updateSource
      tags: [Sources]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourcePatch'
      responses:
        '200':
          description: Updated source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '404':
          description: Not found
        '422':
          description: Hostless SRT listener port is outside this instance's leased range (see /api/v1/server-info)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Hostless SRT listener port is already held by another source or output, or no
            port is free in the range for a port-0 assignment request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: SRT port range not yet allocated from Strom — retry shortly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete source
      operationId: deleteSource
      tags: [Sources]
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found

  /api/v1/sources/{id}/audio-streams:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Discover a source's audio streams
      description: >-
        Read-only (issue #515). Until Strom can report the stream list this
        always returns `discovery: unavailable` with
        `reason: strom-probe-unsupported` and `streams: null`.
      operationId: getSourceAudioStreams
      tags: [Sources]
      responses:
        '200':
          description: Audio-stream discovery result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioStreamDiscovery'
        '404':
          description: Not found

  # ── Graphics ─────────────────────────────────────────────────────────────────

  /api/v1/graphics:
    get:
      summary: List graphics
      operationId: listGraphics
      tags: [Graphics]
      responses:
        '200':
          description: Array of graphics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Graphic'
    post:
      summary: Create graphic
      operationId: createGraphic
      tags: [Graphics]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphicInput'
      responses:
        '201':
          description: Created graphic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Graphic'
        '400':
          description: Validation error

  /api/v1/graphics/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get graphic
      operationId: getGraphic
      tags: [Graphics]
      responses:
        '200':
          description: Graphic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Graphic'
        '404':
          description: Not found
    patch:
      summary: Update graphic
      operationId: updateGraphic
      tags: [Graphics]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphicPatch'
      responses:
        '200':
          description: Updated graphic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Graphic'
        '404':
          description: Not found
    delete:
      summary: Delete graphic
      operationId: deleteGraphic
      tags: [Graphics]
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found

  # ── Outputs ──────────────────────────────────────────────────────────────────

  /api/v1/outputs:
    get:
      summary: List outputs
      operationId: listOutputs
      tags: [Outputs]
      responses:
        '200':
          description: Array of outputs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Output'
    post:
      summary: Create output
      operationId: createOutput
      tags: [Outputs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutputInput'
      responses:
        '201':
          description: Created output
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Output'
        '400':
          description: Validation error
        '422':
          description: Hostless SRT listener port is outside this instance's leased range (see /api/v1/server-info)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Hostless SRT listener port is already held by another source or output, or no
            port is free in the range for a port-0 assignment request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: SRT port range not yet allocated from Strom — retry shortly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/outputs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get output
      operationId: getOutput
      tags: [Outputs]
      responses:
        '200':
          description: Output
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Output'
        '404':
          description: Not found
    patch:
      summary: Update output
      operationId: updateOutput
      tags: [Outputs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutputPatch'
      responses:
        '200':
          description: Updated output
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Output'
        '404':
          description: Not found
        '422':
          description: Hostless SRT listener port is outside this instance's leased range (see /api/v1/server-info)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Hostless SRT listener port is already held by another source or output, or no
            port is free in the range for a port-0 assignment request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: SRT port range not yet allocated from Strom — retry shortly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete output
      operationId: deleteOutput
      tags: [Outputs]
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found

  # ── Recordings (VOD) ─────────────────────────────────────────────────────────

  /api/v1/productions/{id}/recordings:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: List a production's recordings
      operationId: listProductionRecordings
      tags: [Recordings]
      responses:
        '200':
          description: Array of recording assets, each with a presigned playbackUrl
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecordingAsset'
        '404':
          description: Production not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Object storage or database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/recordings:
    get:
      summary: List recordings across all productions
      operationId: listRecordings
      tags: [Recordings]
      responses:
        '200':
          description: Array of recording assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecordingAsset'
        '503':
          description: Object storage or database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/recordings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get a single recording
      operationId: getRecording
      tags: [Recordings]
      responses:
        '200':
          description: Recording asset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingAsset'
        '404':
          description: Recording not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Object storage unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a recording
      description: >-
        Deletes the recording's stored object (signed DeleteObject against the
        same storage target playback uses) and then its list entry (issue #550).
        The object delete is idempotent: a key that is already gone counts as
        deleted, so retrying after a 503 succeeds. On every error the recording
        stays listed. In a versioned bucket only a delete marker is added.
      operationId: deleteRecording
      tags: [Recordings]
      responses:
        '204':
          description: Object and list entry deleted
        '404':
          description: Recording not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            The storage target cannot be resolved; nothing was deleted.
            `reason` is `connection-missing`, `connection-no-bucket`,
            `storage-not-configured` or `bucket-mismatch` (same values as
            `playbackUnavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingDeleteError'
        '502':
          description: >-
            The object store refused or failed the delete; the recording is
            kept. `reason` is `storage-denied` (403 or another auth error) or
            `storage-failed` (any other store error). No S3 response body,
            credentials or URLs are returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingDeleteError'
        '503':
          description: >-
            Database unavailable. If the object was already deleted, a retry
            succeeds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Production Configs ───────────────────────────────────────────────────────

  /api/v1/production-configs:
    get:
      summary: List production configs
      operationId: listProductionConfigs
      tags: [Production Configs]
      responses:
        '200':
          description: Array of production configs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductionConfig'
    post:
      summary: Create production config
      operationId: createProductionConfig
      tags: [Production Configs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductionConfigInput'
      responses:
        '201':
          description: Created config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionConfig'
        '400':
          description: Validation error

  /api/v1/production-configs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      summary: Update production config
      operationId: updateProductionConfig
      tags: [Production Configs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductionConfigPatch'
      responses:
        '200':
          description: Updated config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionConfig'
        '404':
          description: Not found
    delete:
      summary: Delete production config
      operationId: deleteProductionConfig
      tags: [Production Configs]
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found

  # ── Productions ──────────────────────────────────────────────────────────────

  /api/v1/productions:
    get:
      summary: List productions
      operationId: listProductions
      tags: [Productions]
      responses:
        '200':
          description: Array of productions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Production'
    post:
      summary: Create production
      operationId: createProduction
      tags: [Productions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductionInput'
      responses:
        '201':
          description: Created production
