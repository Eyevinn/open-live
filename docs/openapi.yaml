          in: query
          schema:
            type: string
          description: URL-encoded session URL
      responses:
        '204':
          description: Session closed

  # ── Guest calling (epic #208, issue #299) ─────────────────────────────────────

  /api/v1/productions/{id}/guests/invites:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Create a production-scoped guest invite
      description: |
        Mints an HMAC-signed, expiring invite token. The raw token is returned
        exactly once; only its SHA-256 hash is persisted. Requires the shared
        API key. Guest calling is on by default (the backend generates and stores
        its own signing key); 503 only occurs if no signing key could be loaded at
        startup (e.g. the database was unreachable and no `GUEST_INVITE_SECRET`
        override is set).
      operationId: createGuestInvite
      tags: [Guests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestInviteCreate'
      responses:
        '201':
          description: Invite created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestInviteCreated'
        '400':
          description: >-
            Invalid body, or the invite does not target a declared guest slot
            (issue #381: `mixerInput` must name a source assignment with a
            `returnFeed` on this production).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Production not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Guest calling disabled or database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: List guest invites for a production
      operationId: listGuestInvites
      tags: [Guests]
      responses:
        '200':
          description: Invites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GuestInvite'
        '404':
          description: Production not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Guest calling disabled or database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/productions/{id}/guests/invites/{inviteId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: inviteId
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Revoke a guest invite
      operationId: deleteGuestInvite
      tags: [Guests]
      responses:
        '204':
          description: Invite revoked
        '403':
          description: Invite belongs to a different production
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Invite not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/guests/{inviteId}/slot:
    parameters:
      - name: inviteId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: What the guest's slot takes (token-authed, read-only)
      description: |
        Lets the guest page decide, before asking for a camera or microphone,
        whether the slot takes WHIP from the browser or is return-only. Creates
        no session. Authenticates with the per-invite token, like join.
      operationId: guestSlot
      tags: [Guests]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The slot
          content:
            application/json:
              schema:
                type: object
                required: [mixerInput, returnOnly]
                properties:
                  mixerInput:
                    type: string
                  returnOnly:
                    type: boolean
        '401':
          description: Missing, invalid, or revoked invite token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Production not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Invite expired, production ended, or the slot is no longer a guest slot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Guest calling disabled or database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/guests/{inviteId}/join:
    parameters:
      - name: inviteId
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Guest join (token-authed)
      description: |
        Called by the guest browser via the invite link. Authenticates with the
        per-invite HMAC token in `Authorization: Bearer <token>` — NOT the shared
        API key. `whipUrl` reuses the existing WHIP proxy contract; it is absent
        (and `returnOnly` is true) when the slot's source is not WHIP.
      operationId: guestJoin
      tags: [Guests]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Join accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestJoinResult'
        '401':
          description: Missing, invalid, or revoked invite token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Production not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Invite expired, its guest slot is no longer available, or the slot is
            occupied by another live guest (`Guest slot occupied` — issue #381:
            one guest per slot; a reconnect on the same invite is not a conflict).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Guest calling disabled or database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/guests/{inviteId}/session:
    parameters:
      - name: inviteId
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Guest leaves (token-authed)
      operationId: guestLeave
      tags: [Guests]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Session ended
        '401':
          description: Missing, invalid, or revoked invite token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Guest calling disabled or database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/guests/{inviteId}/session/return:
    parameters:
      - name: inviteId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Guest reads their own return mode (token-authed)
      description: >-
        The current return mode of the guest's slot. The guest page polls this to
        follow changes the crew makes. Needs the invite's live session; the
        mixerInput is the session's.
      operationId: guestGetReturnMode
      tags: [Guests]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current return mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestReturnState'
        '401':
          description: Missing, invalid, revoked or expired invite token, or the guest has left or been removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No return on that input, or production not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Guest calling disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Guest switches their own return mode (token-authed)
      description: >-
        Switches the guest's return feed between `program` and `program-minus`
        (mix-minus). Needs the invite's live session, and changes the session's
        mixerInput, so a guest who has left cannot change the return of whoever
        holds the slot now. `low-latency-minus` is not built in v1 and returns 400.
      operationId: guestSetReturnMode
      tags: [Guests]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnModeBody'
      responses:
        '200':
          description: Return mode applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnModeResult'
        '400':
          description: Invalid or unsupported mode (`low-latency-minus`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, invalid, revoked or expired invite token, or the guest has left or been removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No return on that input, or production not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Guest calling disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/productions/{id}/returns/{mixerInput}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: mixerInput
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get the crew/guest join-shape view of a return on an input
      operationId: getReturn
      tags: [Returns]
      responses:
        '200':
          description: Return join shape (publish input, modes, current mode, feeds)
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Production not found, or no assignment on that input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/productions/{id}/returns/{mixerInput}/mode:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: mixerInput
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Crew sets the return mode for an input (persist + apply live + broadcast RETURN_STATE)
      operationId: setReturnMode
      tags: [Returns]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnModeBody'
      responses:
        '200':
          description: Return mode applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnModeResult'
        '400':
          description: Invalid or unsupported mode (`low-latency-minus`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No return on that input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/productions/{id}/returns/{mixerInput}/picture/whep:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: mixerInput
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Establish the return picture WHEP session (server-scoped signaling proxy)
      description: >-
        Proxies a WHEP offer to the Strom return output derived SERVER-SIDE from the
        production's persisted `returnWhepUrls` (scoped to the input). Returns a
        `Location` header rewritten to a session subpath under this route so a guest
        can only tear down their own session.
      operationId: startReturnPictureWhep
      tags: [Returns]
      requestBody:
        required: true
        content:
          application/sdp:
            schema:
              type: string
      responses:
        '201':
          description: WHEP answer SDP
          content:
            application/sdp:
              schema:
                type: string
        '404':
          description: Production not found, or feed unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Production inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Upstream Strom unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/productions/{id}/returns/{mixerInput}/picture/whep/{sessionId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: mixerInput
        in: path
        required: true
        schema:
          type: string
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Tear down the return picture WHEP session
      operationId: stopReturnPictureWhep
      tags: [Returns]
      responses:
        '204':
          description: Session torn down (idempotent)

  /api/v1/productions/{id}/guests:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: List live guest sessions for a production
      operationId: listGuestSessions
      tags: [Guests]
      responses:
        '200':
          description: Guest sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GuestSession'
        '404':
          description: Production not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Guest calling disabled or database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/productions/{id}/guests/{guestId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: guestId
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Kick a guest
      description: Marks the guest session `left`. Take-to-air/preview reuse the existing vision-mixer `SET_PVW`/`TAKE`; no new switching commands are introduced.
      operationId: kickGuest
      tags: [Guests]
      responses:
        '204':
          description: Guest kicked
        '403':
          description: Guest is in a different production
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Guest not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
