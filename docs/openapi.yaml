                    type: object
                    additionalProperties: true
        '404':
          description: Not found

  /api/v1/productions/{id}/audio/{elementId}/processing:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: elementId
        in: path
        required: true
        description: "'ch1', 'ch2', … for a channel strip, or 'main' for the main bus."
        schema:
          type: string
    get:
      summary: Get audio processing state
      description: >
        Returns the current audio processing state for the element — every stage
        valid on it (gain, hpf, gate, comp, eq on a channel; comp, eq, limiter on
        main) with the Strom defaults overlaid by any persisted operator changes.
      operationId: getAudioProcessing
      tags: [Audio]
      responses:
        '200':
          description: Audio processing state
          content:
            application/json:
              schema:
                type: object
                properties:
                  element_id:
                    type: string
                  processing:
                    $ref: '#/components/schemas/AudioProcessing'
        '400':
          description: Invalid channel id
        '404':
          description: Not found
    patch:
      summary: Update audio processing
      description: >
        Sets one processing stage for the element. `params` is partial (move one
        knob) and validated against the Strom ranges — an out-of-range value is
        rejected with 400 and nothing reaches Strom (no silent clamp). The
        setting is persisted on the production and re-applied on activation; it is
        applied live to the running pipeline and broadcast to controller WS
        clients as `AUDIO_PROC_STATE`. Stage/element rules: `limiter` and the main
        `comp`/`eq` are main-only; `gain`/`hpf`/`gate` are channel-only. The HPF
        on/off flag (`hpf.enabled`) is a construction-time Strom property — it is
        persisted but only takes effect on the next activation (the HPF cutoff
        `hpf.freq` is live). The main limiter sits before the master fader until
        Eyevinn/strom#1023 is fixed.
      operationId: updateAudioProcessing
      tags: [Audio]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage, params]
              properties:
                stage:
                  type: string
                  enum: [gain, hpf, gate, comp, eq, limiter]
                params:
                  $ref: '#/components/schemas/AudioProcessingStageParams'
      responses:
        '200':
          description: Updated stage
          content:
            application/json:
              schema:
                type: object
                properties:
                  element_id:
                    type: string
                  stage:
                    type: string
                  params:
                    $ref: '#/components/schemas/AudioProcessingStageParams'
                  applied:
                    type: boolean
                    description: true when the value reached the running Strom pipeline; false when stored for the next activation.
        '400':
          description: Invalid channel id, stage not valid on element, or param out of range
        '404':
          description: Not found
        '422':
          description: Strom refused the write (e.g. a required audio plugin is not available)

